name: CI

on:
  push:
    branches: ['1.x']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Package and Drupal standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Validate package
        run: composer validate --no-check-publish --strict
      - name: Install Drupal Coder
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require drupal/coder:^8.3.24 --no-interaction --no-progress
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"
      - name: Check coding standards
        run: phpcs --standard=phpcs.xml.dist .

  phpstan:
    name: PHPStan (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: module
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd
          tools: composer:v2
          coverage: none
      - name: Build a Drupal codebase for analysis
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          scaffold() {
            rm -rf drupal
            composer create-project 'drupal/recommended-project:~11.4.0' drupal --no-interaction --no-install --no-progress
          }
          retry scaffold
          cd drupal
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config repositories.agency --json '{"type":"path","url":"../module","options":{"symlink":true,"versions":{"drupal/agency":"1.x-dev"}}}'
          retry composer require -W --dev --no-interaction --no-progress \
            'drupal/agency:1.x-dev' \
            'drupal/core-dev:~11.4.0' \
            'phpstan/phpstan:^2' \
            'phpstan/extension-installer:^1.4' \
            'mglaman/phpstan-drupal:^2' \
            'phpstan/phpstan-deprecation-rules:^2'
      - name: Assert the candidate is what is analysed
        working-directory: drupal
        run: |
          test -L web/modules/contrib/agency
          test "$(realpath web/modules/contrib/agency)" = "$(realpath ../module)"
      - name: Run PHPStan
        working-directory: drupal
        run: |
          vendor/bin/phpstan analyze web/modules/contrib/agency \
            -c web/modules/contrib/agency/phpstan.neon.dist \
            --autoload-file=vendor/autoload.php \
            --no-progress --memory-limit=2G

  functional:
    name: Drupal ${{ matrix.minor }} / PHP ${{ matrix.php }}${{ matrix.suffix }}
    # Pin the runner image. Its preinstalled servers are MySQL 8.0 and
    # PostgreSQL 16, which are the versions this matrix claims to test.
    # Starting them here avoids a Docker Hub anonymous pull. Those pulls
    # share a per-IP quota across GitHub-hosted runners and fail the job
    # before checkout.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { minor: '10.6', core: '~10.6.0', php: '8.2', driver: mysql, suffix: '' }
          - { minor: '11.3', core: '~11.3.0', php: '8.3', driver: mysql, suffix: '' }
          # Lock, savepoint and transaction behaviour differ by database engine,
          # not by core minor. Repeat the 11.x floor on PostgreSQL 16 so domain
          # transaction tests execute on both engines.
          - { minor: '11.3', core: '~11.3.0', php: '8.3', driver: pgsql, suffix: ' / PostgreSQL 16' }
          - { minor: '11.4', core: '~11.4.0', php: '8.4', driver: mysql, suffix: '' }
    steps:
      - uses: actions/checkout@v7
        with:
          path: module
          persist-credentials: false
      - name: Start the matrix database
        env:
          DRIVER: ${{ matrix.driver }}
        run: |
          set -euo pipefail
          if [ "$DRIVER" = mysql ]; then
            sudo systemctl start mysql
            # The runner image test logs in as root over the local socket.
            # Drupal connects as agency_test over 127.0.0.1, which matches
            # the '%' account created below.
            version="$(mysql -uroot -proot -N -s -e 'SELECT VERSION()')"
            echo "MySQL server ${version}"
            case "$version" in
              8.0.*) ;;
              *) echo "::error::Expected MySQL 8.0, found ${version}"; exit 1 ;;
            esac
            mysql -uroot -proot <<'SQL'
          CREATE DATABASE IF NOT EXISTS agency_test;
          CREATE USER IF NOT EXISTS 'agency_test'@'%' IDENTIFIED BY 'test_only';
          GRANT ALL PRIVILEGES ON agency_test.* TO 'agency_test'@'%';
          FLUSH PRIVILEGES;
          SQL
            mysql --protocol=TCP -h 127.0.0.1 -uagency_test -ptest_only agency_test -e 'SELECT 1'
          elif [ "$DRIVER" = pgsql ]; then
            sudo systemctl start postgresql
            version="$(sudo -u postgres psql -tAc 'SHOW server_version')"
            echo "PostgreSQL server ${version}"
            case "$version" in
              16.*) ;;
              *) echo "::error::Expected PostgreSQL 16, found ${version}"; exit 1 ;;
            esac
            # The official Postgres image makes POSTGRES_USER a superuser.
            # Match that privilege for the synthetic test role.
            sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE agency_test WITH LOGIN SUPERUSER PASSWORD 'test_only';
          SQL
            sudo -u postgres createdb --owner=agency_test agency_test
            PGPASSWORD=test_only psql -h 127.0.0.1 -U agency_test -d agency_test -c 'SELECT 1'
          else
            echo "::error::Unknown database driver ${DRIVER}"
            exit 1
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_mysql, pdo_pgsql
          tools: composer:v2
          coverage: none
      - name: Build disposable Drupal host
        env:
          CORE_CONSTRAINT: ${{ matrix.core }}
        run: |
          composer create-project "drupal/recommended-project:${CORE_CONSTRAINT}" drupal --no-interaction --no-install --no-progress
          cd drupal
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config --no-plugins allow-plugins.php-http/discovery true
          composer config repositories.agency --json '{"type":"path","url":"../module","options":{"symlink":true,"versions":{"drupal/agency":"1.x-dev"}}}'
          composer require -W --no-interaction --no-progress 'drupal/agency:1.x-dev'
          composer require -W --dev --no-interaction --no-progress "drupal/core-dev:${CORE_CONSTRAINT}"
          # Host kernel tests need the identity/OAuth stack and Drush discovery.
          # Pin the reviewed Externalauth and OpenID Connect writers. Do not
          # install smtp or postmark_webhooks: those cases skip when absent.
          composer require -W --no-interaction --no-progress \
            'drupal/config_ignore:^3.4' \
            'drupal/consumers:^1.24' \
            'drupal/entity:^1.8' \
            'drupal/externalauth:2.0.13' \
            'drupal/openid_connect:3.0.0-alpha9' \
            'drupal/simple_oauth:^6.1' \
            'drush/drush:^12.5 || ^13' \
            'firebase/php-jwt:^6 || ^7' \
            'phpmailer/phpmailer:^6 || ^7'
      - name: Assert the candidate and core version
        working-directory: drupal
        env:
          EXPECTED_MINOR: ${{ matrix.minor }}
        run: |
          test -L web/modules/contrib/agency
          test "$(realpath web/modules/contrib/agency)" = "$(realpath ../module)"
          core="$(php -r 'require "vendor/autoload.php"; echo \Composer\InstalledVersions::getPrettyVersion("drupal/core");')"
          echo "Testing Drupal ${core}"
          case "$core" in
            "$EXPECTED_MINOR".*) ;;
            *) echo '::error::Resolved core does not match the matrix leg'; exit 1 ;;
          esac
      - name: Start test server
        working-directory: drupal
        run: |
          mkdir -p web/sites/simpletest/browser_output
          php -S 127.0.0.1:8888 -t "$PWD/web" "$PWD/web/.ht.router.php" > server.log 2>&1 &
          echo "$!" > server.pid
          for attempt in $(seq 1 20); do
            echo "Waiting for test server (attempt ${attempt})"
            if curl --silent --output /dev/null http://127.0.0.1:8888/; then
              exit 0
            fi
            sleep 1
          done
          echo '::error::Test server did not start'
          exit 1
      - name: Run domain transaction and concurrency tests
        working-directory: drupal
        env:
          SIMPLETEST_DB: ${{ matrix.driver }}://agency_test:test_only@127.0.0.1/agency_test
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: |
          export BROWSERTEST_OUTPUT_DIRECTORY="$PWD/web/sites/simpletest/browser_output"
          vendor/bin/phpunit -c "$PWD/web/core/phpunit.xml.dist" \
            --log-junit "$PWD/domain-junit.xml" \
            "$PWD/web/modules/contrib/agency/tests/src/Kernel"
          # PHP expressions are intentionally passed literally to PHP.
          # shellcheck disable=SC2016
          php -r '
            $xml = simplexml_load_file("domain-junit.xml");
            if ($xml === false) { exit(1); }
            $required = ["testConcurrentDrainersCommit", "testConcurrentDrainersRollback", "testConcurrentDomainCommit", "testConcurrentDomainRollback", "testInterruptedDrainRetainsIntent", "testDeliveryMarkerFailure", "testSummarySavepointFailure", "testEvidenceHealthAgeAndRollback", "testEvidenceHealthUpgrade", "testEvidenceHealthUnavailable", "testEvidenceHealthTransactionBoundary", "testEvidenceHealthSlowFailure", "testPolicyWriterWaitsForCommit", "testPolicyWriterWaitsForRollback", "testDomainInventoryAfterWaitingWriter", "testDomainInventoryAfterRolledBackWriter", "testCompleteRemovalAndAuthorizedReplay", "testInterruptedBatchLeavesCompletedRemovals", "testWithdrawnRetentionUsesCurrentPolicy", "testConcurrentReferenceCommit", "testConcurrentReferenceRollback", "testConcurrentPolicyCommit", "testEvidenceFailureRollsBackRemoval", "testLostApplicationResponse"];
            $executed = [];
            foreach ($xml->xpath("//testcase") as $case) {
              if (isset($case->skipped)) { exit(1); }
              $executed[] = (string) $case["name"];
            }
            echo "Executed domain tests: " . count($executed) . "\n";
            if (array_diff($required, $executed)) { exit(1); }
          '
      - name: Run installed-host functional tests
        working-directory: drupal
        env:
          SIMPLETEST_DB: ${{ matrix.driver }}://agency_test:test_only@127.0.0.1/agency_test
          SIMPLETEST_BASE_URL: http://127.0.0.1:8888
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: |
          export BROWSERTEST_OUTPUT_DIRECTORY="$PWD/web/sites/simpletest/browser_output"
          vendor/bin/phpunit -c "$PWD/web/core/phpunit.xml.dist" \
            --log-junit "$PWD/junit.xml" \
            "$PWD/web/modules/contrib/agency/tests/src/Functional"
          # PHP expressions are intentionally passed literally to PHP.
          # shellcheck disable=SC2016
          php -r '
            $xml = simplexml_load_file("junit.xml");
            if ($xml === false) { exit(1); }
            $executed = 0;
            foreach ($xml->xpath("//testcase") as $case) {
              if (!isset($case->skipped)) { $executed++; }
            }
            echo "Executed tests: $executed\n";
            if ($executed < 2) { exit(1); }
          '
      - name: Run agency_host unit, kernel and functional tests
        working-directory: drupal
        env:
          SIMPLETEST_DB: ${{ matrix.driver }}://agency_test:test_only@127.0.0.1/agency_test
          SIMPLETEST_BASE_URL: http://127.0.0.1:8888
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: |
          export BROWSERTEST_OUTPUT_DIRECTORY="$PWD/web/sites/simpletest/browser_output"
          host="$PWD/web/modules/contrib/agency/modules/agency_host/tests/src"
          test -d "$host/Kernel"
          paths=("$host/Unit")
          # Drupal 10.6's PHPUnit 9 runner is the unit suite. Kernel proofs
          # for the host adapter run on the 11.x lanes, including PostgreSQL 16.
          if [ "${{ matrix.minor }}" != "10.6" ]; then
            paths+=("$host/Kernel")
            if [ -d "$host/Functional" ]; then
              paths+=("$host/Functional")
            fi
          fi
          vendor/bin/phpunit -c "$PWD/web/core/phpunit.xml.dist" \
            --log-junit "$PWD/agency-host-junit.xml" \
            "${paths[@]}"
          # PHP expressions are intentionally passed literally to PHP.
          # shellcheck disable=SC2016
          php -r '
            $xml = simplexml_load_file("agency-host-junit.xml");
            if ($xml === false) { exit(1); }
            $driver = getenv("SIMPLETEST_DB");
            $pgsql = is_string($driver) && str_starts_with($driver, "pgsql:");
            $executed = 0;
            $skipped = [];
            $names = [];
            foreach ($xml->xpath("//testcase") as $case) {
              $name = (string) $case["name"];
              $names[] = $name;
              if (isset($case->failure) || isset($case->error)) { exit(1); }
              if (isset($case->skipped)) {
                $skipped[] = $name;
                continue;
              }
              $executed++;
            }
            echo "Executed agency_host tests: $executed\n";
            echo "Skipped agency_host tests: " . count($skipped) . "\n";
            if ($executed < 1) { exit(1); }
            $optional = [
              "testInvitationDeliveryActualSmtpEnvelopeWithoutNetwork",
              "testInvitationDeliveryUsesAuthoritativeSuppression",
            ];
            foreach ($optional as $name) {
              if (in_array($name, $skipped, TRUE)) {
                echo "Skipped optional $name (module absent)\n";
              }
            }
            if (!$pgsql) { exit(0); }
            $required = [
              "testCleanOriginQualificationPrimaryRollback with data set #1",
              "testCleanOriginQualificationLedgerFault with data set #4",
              "testCleanOriginQualificationLedgerFault with data set #5",
              "testCleanOriginQualificationLedgerFault with data set #6",
              "testCleanOriginQualificationLedgerFault with data set #7",
            ];
            foreach ($required as $name) {
              if (!in_array($name, $names, TRUE) || in_array($name, $skipped, TRUE)) {
                fwrite(STDERR, "PostgreSQL 16 must execute $name without skip\n");
                exit(1);
              }
            }
          '
      - name: Stop test server
        if: always()
        run: |
          if [ -f drupal/server.pid ]; then
            kill "$(cat drupal/server.pid)" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agency-core-${{ matrix.minor }}-${{ matrix.driver }}
          path: |
            drupal/junit.xml
            drupal/domain-junit.xml
            drupal/agency-host-junit.xml
            drupal/composer.lock
            drupal/server.log
