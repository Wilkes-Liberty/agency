name: CI

on:
  push:
    branches: ['1.x']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Package and Drupal standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Validate package
        run: composer validate --no-check-publish --strict
      - name: Install Drupal Coder
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require drupal/coder:^8.3.24 --no-interaction --no-progress
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"
      - name: Check coding standards
        run: phpcs --standard=phpcs.xml.dist .

  tenant-strings:
    name: No tenant strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: yaml
          coverage: none
          tools: phpunit:10.5
      - name: Run tenant-string unit check
        run: |
          phpunit --log-junit tenant-strings-junit.xml \
            tests/src/Unit/TenantStringGuardTest.php
          php -r '
            $xml = simplexml_load_file("tenant-strings-junit.xml");
            if ($xml === false) { exit(1); }
            $executed = 0;
            $names = [];
            foreach ($xml->xpath("//testcase") as $case) {
              $name = (string) $case["name"];
              $names[] = $name;
              if (isset($case->failure) || isset($case->error)) { exit(1); }
              if (isset($case->skipped)) { exit(1); }
              $executed++;
            }
            echo "Executed tenant-string tests: $executed\n";
            if ($executed < 2) { exit(1); }
            if (!in_array("testSeededFixtureFails", $names, TRUE)) { exit(1); }
            if (!in_array("testPublishedPackagePasses", $names, TRUE)) { exit(1); }
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agency-tenant-strings
          path: tenant-strings-junit.xml

  phpstan:
    name: PHPStan (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: module
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd
          tools: composer:v2
          coverage: none
      - name: Build a Drupal codebase for analysis
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          scaffold() {
            rm -rf drupal
            composer create-project 'drupal/recommended-project:~11.4.0' drupal --no-interaction --no-install --no-progress
          }
          retry scaffold
          cd drupal
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config repositories.agency --json '{"type":"path","url":"../module","options":{"symlink":true,"versions":{"drupal/agency":"1.x-dev"}}}'
          retry composer require -W --dev --no-interaction --no-progress \
            'drupal/agency:1.x-dev' \
            'drush/drush:^13' \
            'drupal/core-dev:~11.4.0' \
            'phpstan/phpstan:^2' \
            'phpstan/extension-installer:^1.4' \
            'mglaman/phpstan-drupal:^2' \
            'phpstan/phpstan-deprecation-rules:^2'
      - name: Assert the candidate is what is analysed
        working-directory: drupal
        run: |
          test -L web/modules/contrib/agency
          test "$(realpath web/modules/contrib/agency)" = "$(realpath ../module)"
      - name: Run PHPStan
        working-directory: drupal
        run: |
          vendor/bin/phpstan analyze web/modules/contrib/agency \
            -c web/modules/contrib/agency/phpstan.neon.dist \
            --autoload-file=vendor/autoload.php \
            --no-progress --memory-limit=2G

  functional:
    name: Drupal ${{ matrix.minor }} / PHP ${{ matrix.php }}${{ matrix.suffix }}
    # Pin the runner image. Its preinstalled servers are MySQL 8.0 and
    # PostgreSQL 16, which are the versions this matrix claims to test.
    # Starting them here avoids a Docker Hub anonymous pull. Those pulls
    # share a per-IP quota across GitHub-hosted runners and fail the job
    # before checkout.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { minor: '10.6', core: '~10.6.0', php: '8.2', driver: mysql, suffix: '' }
          - { minor: '11.3', core: '~11.3.0', php: '8.3', driver: mysql, suffix: '' }
          # Lock, savepoint and transaction behaviour differ by database engine,
          # not by core minor. Repeat the 11.x floor on PostgreSQL 16 so domain
          # transaction tests execute on both engines.
          - { minor: '11.3', core: '~11.3.0', php: '8.3', driver: pgsql, suffix: ' / PostgreSQL 16' }
          - { minor: '11.4', core: '~11.4.0', php: '8.4', driver: mysql, suffix: '' }
    steps:
      - uses: actions/checkout@v7
        with:
          path: module
          persist-credentials: false
      - name: Start the matrix database
        env:
          DRIVER: ${{ matrix.driver }}
        run: |
          set -euo pipefail
          if [ "$DRIVER" = mysql ]; then
            sudo systemctl start mysql
            # The runner image test logs in as root over the local socket.
            # Drupal connects as agency_test over 127.0.0.1, which matches
            # the '%' account created below.
            version="$(mysql -uroot -proot -N -s -e 'SELECT VERSION()')"
            echo "MySQL server ${version}"
            case "$version" in
              8.0.*) ;;
              *) echo "::error::Expected MySQL 8.0, found ${version}"; exit 1 ;;
            esac
            # Synthetic fault proofs create triggers with the database-scoped
            # test role. Permit that on this isolated runner's binary log.
            mysql -uroot -proot <<'SQL'
          SET GLOBAL log_bin_trust_function_creators = 1;
          CREATE DATABASE IF NOT EXISTS agency_test;
          CREATE USER IF NOT EXISTS 'agency_test'@'%' IDENTIFIED BY 'test_only';
          GRANT ALL PRIVILEGES ON agency_test.* TO 'agency_test'@'%';
          FLUSH PRIVILEGES;
          SQL
            mysql --protocol=TCP -h 127.0.0.1 -uagency_test -ptest_only agency_test -e 'SELECT 1'
          elif [ "$DRIVER" = pgsql ]; then
            sudo systemctl start postgresql
            version="$(sudo -u postgres psql -tAc 'SHOW server_version')"
            echo "PostgreSQL server ${version}"
            case "$version" in
              16.*) ;;
              *) echo "::error::Expected PostgreSQL 16, found ${version}"; exit 1 ;;
            esac
            # The official Postgres image makes POSTGRES_USER a superuser.
            # Match that privilege for the synthetic test role.
            sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE agency_test WITH LOGIN SUPERUSER PASSWORD 'test_only';
          SQL
            sudo -u postgres createdb --owner=agency_test agency_test
            PGPASSWORD=test_only psql -h 127.0.0.1 -U agency_test -d agency_test -c 'SELECT 1'
          else
            echo "::error::Unknown database driver ${DRIVER}"
            exit 1
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_mysql, pdo_pgsql
          tools: composer:v2
          coverage: none
      - name: Build disposable Drupal host
        env:
          CORE_CONSTRAINT: ${{ matrix.core }}
        run: |
          composer create-project "drupal/recommended-project:${CORE_CONSTRAINT}" drupal --no-interaction --no-install --no-progress
          cd drupal
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config --no-plugins allow-plugins.php-http/discovery true
          composer config repositories.agency --json '{"type":"path","url":"../module","options":{"symlink":true,"versions":{"drupal/agency":"1.x-dev"}}}'
          composer require -W --no-interaction --no-progress 'drupal/agency:1.x-dev'
          composer require -W --dev --no-interaction --no-progress "drupal/core-dev:${CORE_CONSTRAINT}"
          # Host kernel tests need the identity/OAuth stack and Drush discovery.
          # Pin the reviewed Externalauth and OpenID Connect writers. Do not
          # install smtp or postmark_webhooks: those cases skip when absent.
          composer require -W --no-interaction --no-progress \
            'drupal/config_ignore:^3.4' \
            'drupal/consumers:^1.24' \
            'drupal/entity:^1.8' \
            'drupal/externalauth:2.0.15' \
            'drupal/openid_connect:3.0.0-alpha9' \
            'drupal/simple_oauth:^6.1' \
            'drush/drush:^12.5 || ^13' \
            'firebase/php-jwt:^6 || ^7' \
            'phpmailer/phpmailer:^6 || ^7'
      - name: Assert the candidate and core version
        working-directory: drupal
        env:
          EXPECTED_MINOR: ${{ matrix.minor }}
        run: |
          test -L web/modules/contrib/agency
          test "$(realpath web/modules/contrib/agency)" = "$(realpath ../module)"
          core="$(php -r 'require "vendor/autoload.php"; echo \Composer\InstalledVersions::getPrettyVersion("drupal/core");')"
          echo "Testing Drupal ${core}"
          case "$core" in
            "$EXPECTED_MINOR".*) ;;
            *) echo '::error::Resolved core does not match the matrix leg'; exit 1 ;;
          esac
      - name: Run tenant-string unit check
        working-directory: drupal
        env:
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: |
          vendor/bin/phpunit -c "$PWD/web/core/phpunit.xml.dist" \
            --log-junit "$PWD/tenant-strings-junit.xml" \
            "$PWD/web/modules/contrib/agency/tests/src/Unit/TenantStringGuardTest.php"
          # PHP expressions are intentionally passed literally to PHP.
          # shellcheck disable=SC2016
          php -r '
            $xml = simplexml_load_file("tenant-strings-junit.xml");
            if ($xml === false) { exit(1); }
            $executed = 0;
            $names = [];
            foreach ($xml->xpath("//testcase") as $case) {
              $name = (string) $case["name"];
              $names[] = $name;
              if (isset($case->failure) || isset($case->error)) { exit(1); }
              if (isset($case->skipped)) { exit(1); }
              $executed++;
            }
            echo "Executed tenant-string tests: $executed\n";
            if ($executed < 2) { exit(1); }
            if (!in_array("testSeededFixtureFails", $names, TRUE)) { exit(1); }
            if (!in_array("testPublishedPackagePasses", $names, TRUE)) { exit(1); }
          '
      - name: Run slice 3 deny, replay and timeout tests
        working-directory: drupal
        env:
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: |
          vendor/bin/phpunit -c "$PWD/web/core/phpunit.xml.dist" \
            --log-junit "$PWD/s3-deny-junit.xml" \
            "$PWD/web/modules/contrib/agency/tests/src/Unit/S3"
          # PHP expressions are intentionally passed literally to PHP.
          # shellcheck disable=SC2016
          php -r '
            $xml = simplexml_load_file("s3-deny-junit.xml");
            if ($xml === false) { exit(1); }
            $required = [
              "testUncertainReceiptRetriesOriginalKey",
              "testNewKeySameDigestIsRefused",
              "testCreateOpportunityLeavesDiscoveryRoleAbsent",
              "testRecordActivityLeavesDiscoveryRoleAbsent",
              "testSubmitIntakeLeavesCommercialRoleAbsent",
              "testForeignAndMissingShareNotFound",
              "testMissingTenantClaimIsNotNotFound",
              "testDenyAndMissingShareNotFoundWithoutPayload",
              "testPackageSourceOmitsVendorIdentifiers",
              "testKeys",
              "testInvalidEncodingRefuses",
              "testDailyReviewKeepsCivilTimeAcrossSpringChange",
              "testRepeatedHourHasDistinctStableKeys",
              "testMissingHourDoesNotInventAnOccurrence",
              "testAdjacentPollsDoNotDuplicateBoundary",
              "testWeekdayHourlyIntakeExcludesWeekend",
              "testUnboundedCatchupIsRefused",
              "testMalformedConfigurationIsRefused",
              "testEquivalentPropertyOrdersProduceSameReceipt",
              "testInventedEvidenceIsRefused",
              "testUnknownActionFieldIsRefused",
              "testMarkupCannotEnterDraft",
              "testOversizedDraftIsRefused",
              "testMissingWorkDeclarationIsNotSuccess",
              "testSignedSignal",
              "testOutboxAndPolicyMissingTenantClaim",
              "testOutboxAndPolicyShareNotFoundWithoutPayload",
              "testDeliveryAndToolsMissingTenantClaim",
              "testDeliveryAndToolsShareNotFoundWithoutPayload",
              "testPendingOccupancyIsUncertainDelivery",
              "testConsumedKeyReplayIsNotFound",
              "testUpdatePreservesOmissionsAndExplicitClearing",
              "testActivityPreservesRetryAndParent",
              "testProtectedParentIsRejected",
              "testOwnershipChangeIsRejected",
              "testSeatOperations",
              "testIntentValidation",
              "testSubjectAndPreference",
              "testInquiry",
              "testAccount",
              "testUnsupportedForm",
              "testCatalogDefaultsOmitVendorFields",
              "testExplicitPolicyAndDenials",
              "testSeatsExposeLifecycleActions",
              "testHatchMissingTenantClaim",
              "testHatchShareNotFoundWithoutPayload",
              "testTypedActionsExcludeAuthorityInputs",
              "testUnknownInputIsRejectedWithoutPayload",
              "testUnknownActionAndFailureCode",
              "testAppliesMatchesCommercialRoutesOnly",
              "testAppliesRecordsRouteCacheMetadata",
              "testMap",
              "testMapDoesNotHonorHighestPriority",
              "testLookupMissingTenantClaim",
              "testLookupShareNotFoundWithoutPayload",
              "testClaimNeverCreatesOpportunity",
              "testSearchMissingTenantClaim",
              "testSearchShareNotFoundWithoutPayload",
              "testOperatingSeatsAreNotPortalRoles",
              "testUnboundedOwnerScopeFailsClosed",
              "testMachineDoesNotInheritHumanGrants",
              "testProvisionMissingTenantClaim",
              "testProvisionShareNotFoundWithoutPayload",
              "testIssueMissingTenantClaim",
              "testIssueShareNotFoundWithoutPayload",
            ];
            $executed = [];
            foreach ($xml->xpath("//testcase") as $case) {
              if (isset($case->failure) || isset($case->error) || isset($case->skipped)) { exit(1); }
              $executed[] = (string) $case["name"];
            }
            if (array_diff($required, $executed)) { exit(1); }
            echo "s3-deny-junit.xml: " . count($executed) . " cases executed\n";
          '
      - name: Run Slice 5 unimplemented-transition proofs
        working-directory: drupal
        env:
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: |
          vendor/bin/phpunit -c "$PWD/web/core/phpunit.xml.dist" \
            --log-junit "$PWD/s5-transition-junit.xml" \
            "$PWD/web/modules/contrib/agency/tests/src/Unit/SliceFiveTransitionTest.php"
          # PHP expressions are intentionally passed literally to PHP.
          # shellcheck disable=SC2016
          php -r '
            $xml = simplexml_load_file("s5-transition-junit.xml");
            if ($xml === false) { exit(1); }
            $executed = [];
            foreach ($xml->xpath("//testcase") as $case) {
              $name = (string) $case["name"];
              if (isset($case->failure) || isset($case->error)) { exit(1); }
              if (isset($case->skipped)) { exit(1); }
              $executed[] = $name;
            }
            echo "Executed Slice 5 transition tests: " . count($executed) . "\n";
            $required = [
              "testSliceFiveTypesRemainProposed",
              "testCampaignPauseAndCompleteHaveNoAction",
              "testExpenseLaterStatesHaveNoAction",
              "testAgreementHasEmptyTransitions",
              "testCredentialAndAvailabilityStayProposedActions",
              "testCredentialAvailabilityRosterModulesAreAbsent",
              "testPackageServicesOmitUnregisteredSliceFiveWrites",
              "testPackageSurfaceOmitsUnregisteredSliceFiveIds",
              "testRosterHasNoAction",
            ];
            if (array_diff($required, $executed)) { exit(1); }
          '
      - name: Run contact, statement and signed-document preflight tests
        working-directory: drupal
        env:
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: |
          vendor/bin/phpunit -c "$PWD/web/core/phpunit.xml.dist" \
            --log-junit "$PWD/contact-preflight-junit.xml" \
            "$PWD/web/modules/contrib/agency/tests/src/Unit/ContactPreflightTest.php"
          vendor/bin/phpunit -c "$PWD/web/core/phpunit.xml.dist" \
            --log-junit "$PWD/contact-field-junit.xml" \
            "$PWD/web/modules/contrib/agency/tests/src/Unit/ContactFieldContractTest.php"
          vendor/bin/phpunit -c "$PWD/web/core/phpunit.xml.dist" \
            --log-junit "$PWD/statement-preflight-junit.xml" \
            "$PWD/web/modules/contrib/agency/modules/agency_engagement/tests/src/Unit/StatementPreflightTest.php"
          vendor/bin/phpunit -c "$PWD/web/core/phpunit.xml.dist" \
            --log-junit "$PWD/signed-document-junit.xml" \
            "$PWD/web/modules/contrib/agency/tests/src/Unit/SignedDocument/SignedDocumentPolicyTest.php"
          vendor/bin/phpunit -c "$PWD/web/core/phpunit.xml.dist" \
            --log-junit "$PWD/workforce-unit-junit.xml" \
            "$PWD/web/modules/contrib/agency/tests/src/Unit/Workforce"
          vendor/bin/phpunit -c "$PWD/web/core/phpunit.xml.dist" \
            --log-junit "$PWD/s3-instruction-release-junit.xml" \
            "$PWD/web/modules/contrib/agency/tests/src/Unit/S3/InstructionReleasePolicyTest.php"
          vendor/bin/phpunit -c "$PWD/web/core/phpunit.xml.dist" \
            --log-junit "$PWD/s3-pipeline-stage-junit.xml" \
            "$PWD/web/modules/contrib/agency/tests/src/Unit/S3/PipelineStagePolicyTest.php"
          vendor/bin/phpunit -c "$PWD/web/core/phpunit.xml.dist" \
            --log-junit "$PWD/s3-intake-draft-junit.xml" \
            "$PWD/web/modules/contrib/agency/tests/src/Unit/S3/IntakeDraftPolicyTest.php"
          vendor/bin/phpunit -c "$PWD/web/core/phpunit.xml.dist" \
            --log-junit "$PWD/s3-inquiry-review-junit.xml" \
            "$PWD/web/modules/contrib/agency/tests/src/Unit/S3/InquiryReviewPolicyTest.php"
          # PHP expressions are intentionally passed literally to PHP.
          # shellcheck disable=SC2016
          php -r '
            $required = [
              "contact-preflight-junit.xml" => [
                "testRequiresReviewForBothIdentitiesBeforeProjection",
              ],
              "contact-field-junit.xml" => [
                "testReviewedLayoutKeepsTypedContactFields",
                "testStringStandInsForContactFieldsAreUnreviewed",
              ],
              "workforce-unit-junit.xml" => [
                "testStaffClassificationRefusesHostRoleIds",
                "testInviteStaffRejectsCrossDomainClassification",
              ],
              "signed-document-junit.xml" => [
                "testVerificationRefusesChangedEvidenceAndStrictExpiry",
                "testVerifiedRetryCannotSubstituteAnotherCleanDocument",
                "testAppendKeepsOldPinsAndRequiresExplicitPermissions",
                "testLeaseBoundaryAndTerminalSlots",
                "testHistoricalQualificationAndMetadataBoundary",
                "testHistoryRequiresContiguousOrderedDeltas",
                "testHistoryRefusesConflictingProtectionForTheSameFile",
                "testTerminateRequiresExplicitPermissionAndOpenState",
                "testAttachRefusesExistingEnvelope",
              ],
              "statement-preflight-junit.xml" => [
                "testKeepsExactSnapshotBytesAndDistinctAnchors",
                "testDocumentReplayRefusesForeignNamespaceBeforeSlotReads",
                "testDocumentReplayRefusesForeignEmptySlot",
                "testChallengeQualificationRefusesForeignStatementBeforeReceiptRead",
                "testChallengeReplayRefusesForeignNamespaceBeforeKeyReads",
              ],
              "s3-instruction-release-junit.xml" => [
                "testDisabledOrUnsafeSettingsRefuseWithoutRequests",
                "testPermissionIsRequired",
                "testListOffersReleaseOnlyWhenItCanProceed",
                "testFormRequiresCsrfToken",
                "testHeldInstructionIsAccepted",
                "testDefinitiveRefusalIsTerminal",
                "testNotFoundOrDeniedRetriesToAcceptance",
                "testBadRequestIsRefusedAsFault",
                "testUncertainOutcomesRetryWithTheSameKey",
                "testConcurrentReleaseIsRefusedWhileInFlight",
                "testAuditFailureRollsBackTheTransition",
                "testCredentialsNeverLeak",
              ],
              "s3-pipeline-stage-junit.xml" => [
                "testLostAndParkedCannotSkipStages",
                "testDirectStageBypassDenied",
                "testTransitionAndStaleWrite",
                "testConversionAndWrongOwnerDenial",
              ],
              "s3-intake-draft-junit.xml" => [
                "testUndeclaredFormsWriteNothing",
                "testClaimOnlyNeverDraftsAnOpportunity",
                "testIntakeOwnerFailsClosed",
                "testDraftAuditRollback",
                "testConcurrentFirstArrival",
                "testBusinessDraftsAndReplay",
              ],
              "s3-inquiry-review-junit.xml" => [
                "testReviewDenials",
                "testUndeclaredInquiryFormIsNotReviewable",
                "testReviewedSourceIntake",
              ],
            ];
            foreach ($required as $file => $names) {
              $xml = simplexml_load_file($file);
              if ($xml === false) { exit(1); }
              $executed = [];
              foreach ($xml->xpath("//testcase") as $case) {
                if (isset($case->failure) || isset($case->error) || isset($case->skipped)) { exit(1); }
                $executed[] = (string) $case["name"];
              }
              if (array_diff($names, $executed)) { exit(1); }
              echo "$file: " . count($executed) . " cases executed\n";
            }
          '
      - name: Run engagement deny-path tests
        working-directory: drupal
        env:
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: |
          # PHPUnit 9 (Drupal 10.6) accepts one test file per invocation.
          # PHPUnit 10+ accepts a list; looping keeps both matrix legs honest.
          dir="$PWD/web/modules/contrib/agency/modules/agency_engagement/tests/src/Unit"
          tests=(
            AgencyEngagementCrossTenantDenyTest.php
            AgencyEngagementDiscoveryCrmWallTest.php
            AgencyEngagementVendorNeutralPackageTest.php
            AgencyTimeForeignEntrySubmitTest.php
            AgencyStatementPaymentBoundaryTest.php
            AgencyAssignmentAdminNotBypassTest.php
            AgencyEngagementConsumeOnceTimeoutTest.php
            AgencyClientMembershipPolicyTest.php
            AgencyTimeInputTest.php
            AgencyCommercialAccountProjectionTest.php
            AgencyClientDocumentListingTest.php
            AgencyInstructionSourcePolicyTest.php
            AgencyMembershipAuditTest.php
            AgencyTimeCommandPolicyTest.php
            AgencyEngagementLineageMapTest.php
            AgencyPublicStatementProjectionTest.php
          )
          i=0
          for name in "${tests[@]}"; do
            vendor/bin/phpunit -c "$PWD/web/core/phpunit.xml.dist" \
              --log-junit "$PWD/engagement-deny-part-${i}.xml" \
              "$dir/$name"
            i=$((i+1))
          done
          # PHP expressions are intentionally passed literally to PHP.
          # shellcheck disable=SC2016
          php -r '
            $executed = [];
            foreach (glob("engagement-deny-part-*.xml") ?: [] as $file) {
              $xml = simplexml_load_file($file);
              if ($xml === false) { exit(1); }
              foreach ($xml->xpath("//testcase") as $case) {
                if (isset($case->failure) || isset($case->error) || isset($case->skipped)) { exit(1); }
                $executed[] = (string) $case["name"];
              }
            }
            $required = [
              "testForeignTenantObjectIsNotFound",
              "testHatchMissingTenantIsNotRenamedToNotFound",
              "testOfferAssignmentDoesNotWriteDiscoveryOrCrm",
              "testDiscoveryActionDoesNotCreateEngagement",
              "testPackageOmitsTrackerAndGatewayIdentifiers",
              "testSubmitTimeRefusesForeignEntriesWithHostTimeDoor",
              "testPersonRecordReadUsesDiscoveryNotFound",
              "testIssueStatementDoesNotCallPaymentEngine",
              "testAdministratorFlagIsNotABypass",
              "testConsumedKeyReplayIsNotFound",
              "testExpiredHoldIsNotFoundWithoutClaim",
              "testMembershipGrantDoesNotMintStaffRoles",
              "testExactTimeProvenance",
              "testInvalidInputs",
              "testTrackerContextIsUnsupported",
              "testEmptyProjectionIsExactlyTheAllowlist",
