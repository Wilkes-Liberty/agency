services:
  agency_migrate.post_cutover_writer:
    class: Drupal\agency_migrate\PostCutoverWriter
    arguments: ['@database', '@agency_migrate.authority', '@entity_type.manager', '@plugin.manager.agency_migrate.copier', '@agency_migrate.operation_journal_qualification', '@agency_migrate.identity_writer', '@agency_migrate.outbox', '@datetime.time']
  agency_migrate.operation_journal_qualification:
    class: Drupal\agency_migrate\OperationJournalQualification
    arguments: ['@agency_migrate.operation_journal_policy']
  agency_migrate.operation_journal_policy:
    class: Drupal\agency_migrate\UnavailableOperationJournalPolicy
  plugin.manager.agency_migrate.copier:
    class: Drupal\agency_migrate\Plugin\CopierManager
    parent: default_plugin_manager
  agency_migrate.identity_writer:
    class: Drupal\agency_migrate\IdentityPreservingWriter
    arguments: ['@entity_type.manager', '@database']
  agency_migrate.lineage:
    class: Drupal\agency_migrate\LineageStore
    arguments: ['@database', '@datetime.time']
  agency_migrate.outbox:
    class: Drupal\agency_migrate\MigrateOutbox
    arguments: ['@database', '@audit_chain.logger', '@uuid', '@datetime.time']
  agency_migrate.writes:
    class: Drupal\agency_migrate\PostCutoverWriteLog
    arguments: ['@database', '@datetime.time']
  agency_migrate.host_writer_fence:
    class: Drupal\agency_migrate\UnavailableHostWriterFence
  agency_migrate.rollback_dispositions:
    class: Drupal\agency_migrate\RollbackDispositionRegistry
  agency_migrate.authority:
    class: Drupal\agency_migrate\AuthorityRegister
    arguments:
      - '@current_user'
      - '@agency_migrate.outbox'
      - '@database'
      - '@datetime.time'
      - '@agency_migrate.host_writer_fence'
      - '@agency_migrate.rollback_dispositions'
  agency_migrate.authority_reader:
    class: Drupal\agency_migrate\AuthorityGatedReader
    arguments:
      - '@agency_migrate.authority'
      - '@entity_type.manager'
      - '@agency_migrate.outbox'
      - '@uuid'
      - '@current_user'
  agency_migrate.runner:
    class: Drupal\agency_migrate\MigrationRunner
    arguments:
      - '@plugin.manager.agency_migrate.copier'
      - '@agency_migrate.lineage'
      - '@agency_migrate.outbox'
      - '@database'
      - '@uuid'
      - '@datetime.time'
      - '@current_user'
  agency_migrate.reconciler:
    class: Drupal\agency_migrate\Reconciler
    arguments:
      - '@plugin.manager.agency_migrate.copier'
      - '@agency_migrate.lineage'
      - '@current_user'
      - '@agency_migrate.rollback_replay_store'
      - '@agency_migrate.identity_writer'
      - '@entity_type.manager'
      - '@database'
  agency_migrate.rollback_replay_store:
    class: Drupal\agency_migrate\RollbackReplayStore
    arguments:
      - '@database'
      - '@datetime.time'
      - '@agency_migrate.identity_writer'
      - '@agency_migrate.operation_journal_qualification'
  agency_migrate.rollback_planner:
    class: Drupal\agency_migrate\QualifiedRollbackPlanner
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@agency_migrate.identity_writer'
      - '@agency_migrate.lineage'
      - '@agency_migrate.reconciler'
  agency_migrate.rollback:
    class: Drupal\agency_migrate\RollbackService
    arguments:
      - '@plugin.manager.agency_migrate.copier'
      - '@agency_migrate.rollback_replay_store'
      - '@agency_migrate.authority'
      - '@current_user'
      - '@agency_migrate.reconciler'
      - '@agency_migrate.rollback_planner'
      - '@database'
      - '@agency_migrate.outbox'
  agency_migrate.commands:
    class: Drupal\agency_migrate\Drush\Commands\AgencyMigrateCommands
    arguments:
      - '@agency_migrate.runner'
      - '@agency_migrate.reconciler'
      - '@agency_migrate.authority'
      - '@agency_migrate.rollback'
    tags:
      - { name: drush.command }
