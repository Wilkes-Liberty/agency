    machine_name: agency_person
    label: Person
    status: implemented
    slice: S1
    owning_submodule:
      name: agency_staff
      status: existing
    identifiers:
      integer_id: true
      uuid: true
      revision_id: false
    revisionable: false
    lifecycle:
      states:
        - id: recorded
          terminal: false
          notes: Thin resolver row. Removal deletes the row when unreferenced.
      transitions: []
    properties:
      - name: id
        type: integer
        marking: internal
      - name: uuid
        type: uuid
        marking: internal
      - name: created
        type: timestamp
        marking: internal
      - name: changed
        type: timestamp
        marking: internal
      - name: display_name
        type: string
        marking: personal
      - name: contact_kind
        type: string
        marking: personal
      - name: contact_value
        type: string
        marking: personal
    tenant_scope: *shared_scope
    legacy_sources:
      - crm_contact
      - chronicle_personnel
    notes: Discovery stores a thin resolver only. Slice 2 copies chronicle_personnel person rows here and evidence onto agency_profile_evidence.
  - id: PrincipalBinding
    machine_name: agency_principal
    label: Principal binding
    status: implemented
    slice: S1
