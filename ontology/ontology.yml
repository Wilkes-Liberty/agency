      status: existing
    identifiers:
      integer_id: true
      uuid: true
      revision_id: false
    revisionable: false
    lifecycle:
      states:
        - id: active
          terminal: false
        - id: minimized
          terminal: true
      transitions:
        - from: active
          to: minimized
          action: removeExpiredDiscovery
    properties:
      - name: id
        type: integer
        marking: internal
      - name: uuid
        type: uuid
        marking: confidential
      - name: created
        type: timestamp
        marking: internal
      - name: changed
        type: timestamp
        marking: internal
      - name: principal_key
        type: string
        marking: confidential
      - name: issuer
        type: string
        marking: confidential
      - name: subject
        type: string
        marking: confidential
      - name: person_uuid
        type: uuid
        marking: internal
      - name: status
        type: string
        marking: internal
    tenant_scope: *shared_scope
    legacy_sources: []
    notes: Exact issuer and subject pair. Contact data never selects this row.
