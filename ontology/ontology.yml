        type: integer
        marking: internal
      - name: uuid
        type: uuid
        marking: public
      - name: created
        type: timestamp
        marking: internal
      - name: changed
        type: timestamp
        marking: internal
      - name: revision_id
        type: integer
        marking: internal
      - name: display_name
        type: string
        marking: public
      - name: legal_name
