version: "0.1.1"
status: draft
title: Agency ontology contract
ships_tenant_defaults: false
compatibility:
  scheme: semver
  beta_freezes_released_types: true
  breaking_change: deprecation_cycle
  notes:
    - Draft versions may add proposed types and refine unimplemented shapes.
    - The first beta freezes implemented S1 and S2 types.
    - Removing or renaming an implemented type, state, action, marking or
      required property is a breaking change and needs a deprecation cycle.
    - Host configuration values are not part of this contract.
rules:
  - id: schema_valid
    statement: Objects, links and actions validate against the JSON Schemas.
  - id: every_property_has_a_marking
    statement: Every property has a marking.
  - id: every_action_has_a_permission
    statement: Every action names a permission and its kind.
  - id: every_action_has_evidence
    statement: Every action declares evidence fields and forbidden items.
  - id: no_tenant_specific_strings
    statement: The contract contains no tenant names or domains.
  - id: no_host_prefix_outside_legacy_sources
    statement: Host-prefixed type ids appear only in legacy_sources.
  - id: cross_tenant_reads_denied
    statement: Cross-tenant reads are denied on every object type.
  - id: projections_are_allowlisted
    statement: Each audience projection lists declared properties only.
  - id: identifiers_are_declared
    statement: Every type declares integer id, UUID and revision-id flags.
  - id: transitions_are_closed
    statement: Transitions name declared states and action types.
  - id: implemented_discovery_matches_storage
    statement: Implemented Discovery storage matches the internal entities.
  - id: s5_types_remain_proposed
    statement: Expense, Credential, Availability and Campaign stay proposed.
  - id: compatibility_follows_semver
    statement: Compatibility follows semantic versioning and a deprecation cycle.
  - id: machine_names_use_agency_prefix
    statement: Machine names use the agency_ prefix.
  - id: links_declare_cardinality_and_owner
    statement: Every link declares cardinality and which side owns the reference.
  - id: revisionable_matches_revision_id
    statement: revisionable matches identifiers.revision_id.
  - id: tenant_values_are_host_configuration
    statement: Tenant names, policy periods and copy are host configuration.
  - id: implemented_actions_are_discovery_commands
    statement: Implemented actions include the current Discovery commands.
  - id: s2_recruiting_application_kind
    statement: Relationship declares a proposed recruiting kind for Slice 2.
s2_transfer_map:
  - source: profile_employee
    source_kind: profile_bundle
    disposition: copy
    target: agency_profile_evidence
    copier: profile_employee
    field_guard_marking: personal
    authority_domain: workforce
  - source: profile_contractor
    source_kind: profile_bundle
    disposition: copy
    target: agency_profile_evidence
    copier: profile_contractor
    field_guard_marking: personal
    authority_domain: workforce
  - source: chronicle_personnel
    source_kind: personnel_person
    disposition: copy
    target: agency_person
    copier: chronicle_personnel
    field_guard_marking: personal
    authority_domain: workforce
  - source: chronicle_personnel
    source_kind: personnel_evidence
    disposition: copy
    target: agency_profile_evidence
    copier: chronicle_personnel_evidence
    field_guard_marking: personal
    authority_domain: workforce
  - source: profile_client
    source_kind: profile_bundle
    disposition: host_stay
    collision_preflight: fail_closed
    notes: Client profile bundles are out of Slice 2. Preflight refuses a workforce or recruiting copier that would skip these rows.
  - source: chronicle_staff_invite
    source_kind: invitation_state
    disposition: copy
    target: agency_staff_invitation
    copier: staff_invite_state
    field_guard_marking: personal
    authority_domain: workforce
  - source: staff_onboard
    source_kind: webform_submission
    disposition: copy
    target: agency_staff_onboard
    copier: staff_onboard
    field_guard_marking: personal
    authority_domain: workforce
  - source: career
    source_kind: node_bundle
    disposition: copy
    target: agency_career_posting
    copier: career_node
    field_guard_marking: public
    authority_domain: recruiting
  - source: career_application
    source_kind: webform_submission
    disposition: copy
    target: agency_application
    copier: career_application
    field_guard_marking: personal
    authority_domain: recruiting
  - source: career_resume
    source_kind: file_gate_object
    disposition: copy
    target: agency_application
    copier: career_resume_file
    field_guard_marking: personal
    authority_domain: recruiting
    target_property: resume_file_uuid
  - source: career_upload_token
    source_kind: upload_token
    disposition: file_gate_carry_over
    collision_preflight: fail_closed
    notes: Career-upload claim tokens stay on File Gate. Plaintext is never copied.
  - source: career_resume_job_store
    source_kind: scan_job
    disposition: file_gate_carry_over
    notes: CareerResumeUploadService quarantine and scan job store stays on File Gate.
  - source: career_resume_claim_access
    source_kind: file_gate_claim
    disposition: file_gate_carry_over
    notes: Claim-scoped résumé access stays on File Gate. No public URL.
  - source: career_application_geo_handlers
    source_kind: webform_handler
    disposition: host_stay
    notes: CountryResolver and UsGeoRestrictWebformHandler stay host form mechanics. Applicant geo payload copies with career_application onto Application.geo.
x-tenant: &tenant_scope
  isolation: tenant
  cross_tenant_reads: denied
x-shared: &shared_scope
  isolation: shared_within_tenant
  cross_tenant_reads: denied
x-evidence: &discovery_evidence
  emitted: true
  when: Co-transactional outbox insert on the local write.
  fields:
    - event_id
    - relationship_id
    - subject_hash
    - state
    - waiting_on
    - effective_at
  forbidden:
    - contact
    - note
    - token
    - credential
    - file
    - guessed_identifier
x-workforce-evidence: &workforce_evidence
  emitted: true
  when: Co-transactional outbox insert on the local workforce write.
  fields:
    - event_id
    - relationship_id
    - subject_hash
    - classification_hash
    - state
    - effective_at
  forbidden:
    - contact
    - note
    - token
    - credential
    - file
    - guessed_identifier
x-recruiting-evidence: &recruiting_evidence
  emitted: true
  when: Co-transactional outbox insert on the local recruiting write.
  fields:
    - event_id
    - posting_id
    - application_id
    - subject_hash
    - state
    - effective_at
  forbidden:
    - contact
    - note
    - token
    - credential
    - file
    - guessed_identifier
x-read-evidence: &read_evidence
  emitted: false
  when: Reads do not append evidence.
  fields: []
  forbidden:
    - contact
    - note
    - token
    - credential
    - file
    - guessed_identifier
x-idempotency: &discovery_idempotency
  required: true
  pattern: '^[A-Za-z0-9_.:-]{8,128}$'
  fingerprint: SHA-256 of the canonical input after authorization.
objects:
