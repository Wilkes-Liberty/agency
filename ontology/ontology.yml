actions:
  - id: startDiscovery
    target_type: Relationship
    status: implemented
    slice: S1
    owning_service: agency_staff.commands
    input_schema:
      type: object
      required:
        - display_name
        - contact
        - owner_contact
        - next_action
    validation_rules:
      - Intended issuer and subject are resolved before any write.
      - Contact data never selects or merges a principal.
      - Invitation policy and display name must already be valid.
      - Next-action dates must be future instants.
    permission:
      id: coordinate agency discovery
      kind: drupal_permission
      notes: Also requires host eligibility and Field Guard.
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key:
      <<: *discovery_idempotency
      fingerprint: SHA-256 of input plus the trusted issuer and subject.
    reduces_access: false
  - id: setNextAction
    target_type: Relationship
    status: implemented
    slice: S1
    owning_service: agency_staff.commands
    input_schema:
      type: object
    validation_rules:
      - Ordinary edits require the current version.
      - Owner-only recovery accepts only an owner payload.
      - Moved-forward permits only an agency-owned next action.
    permission:
      id: coordinate agency discovery
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: respond
    target_type: Relationship
    status: implemented
    slice: S1
    owning_service: agency_staff.commands
    input_schema:
      type: object
      required:
        - choice
    validation_rules:
      - Choice is yes, not_now, message, ready or decline_proposal.
      - decline_proposal requires a current proposal.
      - Ready means prepared, not consent or classification.
    permission:
      id: agency_staff.entitled_principal
      kind: entitled_principal
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: pauseRelationship
    target_type: Relationship
    status: implemented
    slice: S1
    owning_service: agency_staff.commands
    input_schema:
      type: object
    validation_rules:
      - Side selects the path. Authority still comes from services.
      - Agency pause requires summary, purpose and a future date.
    permission:
      id: agency_staff.entitled_principal
      kind: entitled_principal
      notes: Agency side uses coordinate agency discovery instead.
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: resumeRelationship
    target_type: Relationship
    status: implemented
    slice: S1
    owning_service: agency_staff.commands
    input_schema:
      type: object
    validation_rules:
      - Only the pausing side may resume.
      - Resume returns exploring and waits on the agency.
    permission:
      id: agency_staff.entitled_principal
      kind: entitled_principal
      notes: Agency side uses coordinate agency discovery instead.
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: withdrawRelationship
    target_type: Relationship
    status: implemented
    slice: S1
    owning_service: agency_staff.commands
    input_schema:
      type: object
    validation_rules:
      - Applies to the latest authorized state despite a stale version.
      - Denial and immutable intent commit together.
      - Terminal retry returns not_found and never restores a grant.
    permission:
      id: agency_staff.entitled_principal
      kind: entitled_principal
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: true
  - id: revokeInvitation
    target_type: Relationship
    status: implemented
    slice: S1
    owning_service: agency_staff.commands
    input_schema:
      type: object
    validation_rules:
      - Revokes generations and entitlement despite a stale version.
      - Relationship state is not reopened.
    permission:
      id: coordinate agency discovery
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: true
  - id: revoke
    target_type: Invitation
    status: implemented
    slice: S1
    owning_service: agency_staff.invitations
    input_schema:
      type: object
    validation_rules:
      - Delegates to revokeInvitation.
    permission:
      id: coordinate agency discovery
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: true
  - id: suspendAccess
    target_type: Relationship
    status: implemented
    slice: S1
    owning_service: agency_staff.commands
    input_schema:
      type: object
    validation_rules:
      - Removes pending, workspace and summary authority immediately.
      - Also applies after withdrawal or close.
    permission:
      id: suspend agency discovery access
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: true
  - id: close
    target_type: Relationship
    status: implemented
    slice: S1
    owning_service: agency_staff.commands
    input_schema:
      type: object
      required:
        - category
        - message
        - contact
    validation_rules:
      - Category must be a configured close reason.
      - Requires durable local evidence.
    permission:
      id: coordinate agency discovery
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: moveForward
    target_type: Relationship
    status: implemented
    slice: S1
    owning_service: agency_staff.commands
    input_schema:
      type: object
    validation_rules:
      - Coordinator proposal keeps state exploring.
      - Participant consent requires the current proposal and version.
      - Consent creates no role, classification or external access.
    permission:
      id: coordinate agency discovery
      kind: drupal_permission
      notes: Participant consent uses entitled_principal.
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: issue
    target_type: Invitation
    status: implemented
    slice: S1
    owning_service: agency_staff.invitations
    input_schema:
      type: object
    validation_rules:
      - Relationship must be invited with a pending entitlement.
      - Token is returned only on the first success.
    permission:
      id: coordinate agency discovery
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: resend
    target_type: Invitation
    status: implemented
    slice: S1
    owning_service: agency_staff.invitations
    input_schema:
      type: object
    validation_rules:
      - Supersedes every earlier active generation.
      - Retry of the same key never returns the bearer token.
    permission:
      id: coordinate agency discovery
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: accept
    target_type: Invitation
    status: implemented
    slice: S1
    owning_service: agency_staff.invitations
    input_schema:
      type: object
      required:
        - token
    validation_rules:
      - POST only.
      - Current authenticated issuer and subject must match the intended pair.
      - Used token cannot bind again.
    permission:
      id: agency_staff.entitled_principal
      kind: entitled_principal
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: inspect
    target_type: Invitation
    status: implemented
    slice: S1
    owning_service: agency_staff.invitations
    input_schema:
      type: object
      required:
        - token
    validation_rules:
      - GET never consumes or binds.
      - Missing, closed and used tokens share a closed shape plus support route.
    permission:
      id: invitation.token
      kind: invitation_token
    approval_rule: null
    evidence: *read_evidence
    idempotency_key:
      required: false
      pattern: '^[A-Za-z0-9_.:-]{8,128}$'
    reduces_access: false
  - id: removeExpiredDiscovery
    target_type: Relationship
    status: implemented
    slice: S1
    owning_service: agency_staff.retention_removal
    input_schema:
      type: object
      required:
        - plan_sha256
    validation_rules:
      - Rechecks the exact plan under the writer and policy fences.
      - Shared person and identity rows remain when still referenced.
    permission:
      id: remove expired agency discovery
      kind: maintenance_permission
    approval_rule: Reviewed retention plan and exact retry key.
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
    notes: Retention after a terminal state. Not the deny-first access path.
  - id: createOrganization
    target_type: Organization
    status: proposed
    slice: S2
    input_schema:
      type: object
    validation_rules:
      - Display name is required. Legal name is optional.
    permission:
      id: agency_workforce.coordinate
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: archiveOrganization
    target_type: Organization
    status: proposed
    slice: S2
    input_schema:
      type: object
    validation_rules:
      - Archiving does not delete membership history.
    permission:
      id: agency_workforce.coordinate
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: grantMembership
    target_type: Membership
    status: proposed
    slice: S2
    input_schema:
      type: object
    validation_rules:
      - Membership is not an access grant or assignment.
    permission:
      id: agency_workforce.coordinate
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: endMembership
    target_type: Membership
    status: proposed
    slice: S2
    input_schema:
      type: object
    validation_rules:
      - Ending membership does not delete the person.
    permission:
      id: agency_workforce.coordinate
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: inviteStaff
    target_type: StaffInvitation
    status: proposed
    slice: S2
    input_schema:
      type: object
    validation_rules:
      - Classification is employee or contractor and is supplied by the issuer.
      - Contact data never selects or merges a principal.
      - Capture is not sending.
    permission:
      id: agency_workforce.coordinate
      kind: drupal_permission
    approval_rule: null
    evidence: *workforce_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: acceptStaffInvitation
    target_type: StaffInvitation
    status: proposed
    slice: S2
    input_schema:
      type: object
      required:
        - token
    validation_rules:
      - POST only.
      - Current authenticated issuer and subject must match the intended pair.
      - Used token cannot bind again.
      - Host uid mint happens after the Agency commit.
    permission:
      id: agency_staff.entitled_principal
      kind: entitled_principal
    approval_rule: null
    evidence: *workforce_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: revokeStaffInvitation
    target_type: StaffInvitation
    status: proposed
    slice: S2
    input_schema:
      type: object
    validation_rules:
      - Revokes generations and workforce entitlement despite a stale version.
      - Discovery state is not reopened.
    permission:
      id: agency_workforce.coordinate
      kind: drupal_permission
    approval_rule: null
    evidence: *workforce_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: true
  - id: updateProfileEvidence
    target_type: ProfileEvidence
    status: proposed
    slice: S2
    input_schema:
      type: object
    validation_rules:
      - Field names must match the server marking map.
      - File bytes, data URIs and remote bodies are refused.
    permission:
      id: agency_staff.entitled_principal
      kind: entitled_principal
      notes: Coordinator writes use agency_workforce.coordinate.
    approval_rule: null
    evidence: *workforce_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: createCareerPosting
    target_type: CareerPosting
    status: proposed
    slice: S2
    input_schema:
      type: object
    validation_rules:
      - Create writes draft only. Publish is a separate action.
    permission:
      id: agency_recruiting.coordinate
      kind: drupal_permission
    approval_rule: null
    evidence: *recruiting_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: publishCareerPosting
    target_type: CareerPosting
    status: proposed
    slice: S2
    input_schema:
      type: object
    validation_rules:
      - An open role with no close date or a past close date cannot publish.
    permission:
      id: agency_recruiting.coordinate
      kind: drupal_permission
    approval_rule: null
    evidence: *recruiting_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: closeCareerPosting
    target_type: CareerPosting
    status: proposed
    slice: S2
    input_schema:
      type: object
    validation_rules:
      - Closed roles refuse role-bound submit. The general application door stays available.
    permission:
      id: agency_recruiting.coordinate
      kind: drupal_permission
    approval_rule: null
    evidence: *recruiting_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: submitApplication
    target_type: Application
    status: proposed
    slice: S2
    input_schema:
      type: object
    validation_rules:
      - Stores File Gate résumé references only.
      - Does not mint a principal, uid or workforce classification.
      - Role-bound submit is refused when the posting is closed.
    permission:
      id: agency_recruiting.submit
      kind: entitled_principal
      notes: Anonymous submit is host-mediated and does not mint a principal.
    approval_rule: null
    evidence: *recruiting_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: createOpportunity
    target_type: Opportunity
    status: proposed
    slice: S3
    input_schema:
      type: object
    validation_rules:
      - Discovery explorers never become commercial contacts through this action.
    permission:
      id: agency_commercial.coordinate
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: closeOpportunity
    target_type: Opportunity
    status: proposed
    slice: S3
    input_schema:
      type: object
    validation_rules:
      - Outcome is won or lost.
    permission:
      id: agency_commercial.coordinate
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: recordActivity
    target_type: Activity
    status: proposed
    slice: S3
    input_schema:
      type: object
    validation_rules:
      - Summary is bounded plain text.
    permission:
      id: agency_commercial.coordinate
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: submitIntake
    target_type: IntakeSubmission
    status: proposed
    slice: S3
    input_schema:
      type: object
    validation_rules:
      - Dispatch is idempotent on dispatch_key.
    permission:
      id: agency_intake.submit
      kind: entitled_principal
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: offerAssignment
    target_type: Assignment
    status: proposed
    slice: S4
    input_schema:
      type: object
    validation_rules:
      - Offer creates no access grant.
    permission:
      id: agency_engagement.coordinate
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: acceptAssignment
    target_type: Assignment
    status: proposed
    slice: S4
    input_schema:
      type: object
    validation_rules:
      - Acceptance is not settlement.
    permission:
      id: agency_staff.entitled_principal
      kind: entitled_principal
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: submitTime
    target_type: TimeSubmission
    status: proposed
    slice: S4
    input_schema:
      type: object
    validation_rules:
      - Entries in the submission must belong to the actor.
    permission:
      id: agency_staff.entitled_principal
      kind: entitled_principal
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: acceptTimeSubmission
    target_type: TimeSubmission
    status: proposed
    slice: S4
    input_schema:
      type: object
    validation_rules:
      - Acceptance is not settlement and does not move money.
    permission:
      id: agency_engagement.coordinate
      kind: drupal_permission
    approval_rule: optional reviewer approval policy supplied by the host
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: issueStatement
    target_type: Statement
    status: proposed
    slice: S4
    input_schema:
      type: object
    validation_rules:
      - Statement snapshots accepted submissions. Payment stays outside Agency.
    permission:
      id: agency_engagement.coordinate
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: recordExpense
    target_type: Expense
    status: proposed
    slice: S5
    input_schema:
      type: object
    validation_rules:
      - Amount is required and marked financial.
    permission:
      id: agency_engagement.coordinate
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: verifyCredential
    target_type: Credential
    status: proposed
    slice: S5
    input_schema:
      type: object
    validation_rules:
      - Verification is not readiness and not an access grant.
    permission:
      id: agency_workforce.coordinate
      kind: drupal_permission
    approval_rule: optional verifier approval policy supplied by the host
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: offerAvailability
    target_type: Availability
    status: proposed
    slice: S5
    input_schema:
      type: object
    validation_rules:
      - Availability is not a commitment.
    permission:
      id: agency_staff.entitled_principal
      kind: entitled_principal
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
  - id: launchCampaign
    target_type: Campaign
    status: proposed
    slice: S5
    input_schema:
      type: object
    validation_rules:
      - Launch does not grant relationship or roster authority.
    permission:
      id: agency_campaign.coordinate
      kind: drupal_permission
    approval_rule: null
    evidence: *discovery_evidence
    idempotency_key: *discovery_idempotency
    reduces_access: false
projections:
  - audience: participant_workspace
    object: Relationship
    fields:
      - uuid
      - kind
      - state
      - waiting_on
      - display_waiting_on
      - owner_name
      - owner_contact
      - owner_changed_at
      - next_action
      - agency_late
      - changed
      - version
      - pause_origin
      - proposal
      - agreed_next_step
      - permitted_actions
      - permitted_choices
  - audience: participant_summary
    object: Relationship
    fields:
      - state
      - terminal_at
      - close_message
      - close_contact
  - audience: participant_summary_entitlement
    object: Entitlement
    fields:
      - readable_until
  - audience: coordinator_queue
    object: Relationship
    fields:
      - uuid
      - state
      - waiting_on
      - version
      - owner_unavailable
      - last_agency_action_at
      - pause_note
      - withdrawal_note
      - permitted_actions
  - audience: evidence_metadata
    object: Evidence
    fields:
      - event_id
      - relationship_id
      - subject_hash
      - state
      - waiting_on
      - effective_at
