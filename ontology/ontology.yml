          action: respond
        - from: exploring
          to: prepared
          action: respond
        - from: exploring
          to: paused
          action: pauseRelationship
        - from: exploring
          to: moved_forward
          action: moveForward
        - from: exploring
          to: withdrawn
          action: withdrawRelationship
        - from: exploring
          to: closed
          action: close
        - from: prepared
          to: exploring
          action: respond
        - from: prepared
          to: prepared
          action: respond
        - from: prepared
          to: paused
          action: pauseRelationship
        - from: prepared
          to: moved_forward
          action: moveForward
        - from: prepared
          to: withdrawn
          action: withdrawRelationship
        - from: prepared
          to: closed
