agency_workforce_test.settings:
  type: config_object
  label: Synthetic workforce policy
  mapping:
    scope: {type: string, label: Scope}
    collection: {type: string, label: Collection override}
    minimum: {type: integer, label: Minimum duration}
    maximum: {type: integer, label: Maximum duration}
    duration: {type: integer, label: Default duration}
    default_language: {type: string, label: Default language}
    languages:
      type: sequence
      label: Configured languages
      sequence: {type: string, label: Language}
    clock: {type: integer, label: Synthetic time}
    fault: {type: string, label: Synthetic fault}
    hold_file: {type: string, label: Synthetic hold marker}
    release_file: {type: string, label: Synthetic release marker}
